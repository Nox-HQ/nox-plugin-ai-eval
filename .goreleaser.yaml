# Shared GoReleaser template for nox plugins. Each plugin's repo
# copies this verbatim and parameterises only the project_name. The
# archive naming convention matches the URL pattern in the registry
# index, so a successful release auto-aligns with the marketplace
# entry produced by `nox plugin entry`.

version: 2

project_name: nox-plugin-ai-eval

before:
  hooks:
    # Strip replace directives first — plugin source uses local
    # `replace ../..` during development; standalone releases must
    # consume the published module. Order matters: sed runs before
    # any `go mod` command can resolve the missing path.
    - sh -c "sed -i.bak '/^replace /d' go.mod && rm -f go.mod.bak"
    - go mod tidy
    - go mod download
    - go test ./...

builds:
  - id: plugin
    binary: nox-plugin-ai-eval
    main: ./
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    flags:
      - -trimpath

archives:
  - id: plugin-archive
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - plugin.yaml

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Cosign keyless signing of checksums.txt. The bundle
# (checksums.txt.sigstore.json) carries signature and certificate together; it
# is the format cosign v4 requires, and what the release notes tell users to
# verify with.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    artifacts: checksum
    output: true
    args:
      - sign-blob
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"

sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request

release:
  draft: false
  prerelease: auto
  footer: |
    ## Install

    Add to your registry:

    ```bash
    nox plugin install nox/ai-eval
    ```

    Or pin a specific version:

    ```bash
    nox plugin install nox/ai-eval@{{ .Version }}
    ```

    Verify the release artifacts:

    ```bash
    cosign verify-blob checksums.txt \
      --bundle checksums.txt.sigstore.json \
      --certificate-identity "https://github.com/Nox-HQ/nox-plugin-ai-eval/.github/workflows/release.yml@refs/tags/{{ .Tag }}" \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    ```
